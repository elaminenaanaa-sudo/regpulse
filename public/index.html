function kwScan(tx){const lc=tx.toLowerCase();return S.map(s=>{const r=s.ch.map(c=>({...c,f:c.kw.some(k=>lc.includes(k))}));const tw=r.reduce((a,x)=>a+x.wt,0);const fw=r.filter(x=>x.f).reduce((a,x)=>a+x.wt,0);return{...s,r,sc:tw?fw/tw:0}})}

/* AI ANALYSIS PROMPT */
const AI_PROMPT=`You are CRegul, an expert bank examination analyst. You have deep knowledge of OCC Comptroller's Handbook (Rating Credit Risk, Loan Portfolio Management, Leveraged Lending), FDIC examination procedures and MRBA data, Federal Reserve SR Letters (SR 98-25, SR 21-19, SR 16-11), interagency classification standards, and real enforcement actions.

Analyze this credit review memorandum against regulatory examiner standards. For each of the following 12 categories, provide:
1. A score from 0-100 
2. A status: "strong", "adequate", "weak", or "missing"
3. 1-3 specific findings (what's good, what's missing, what an examiner would flag)
4. A specific recommendation if the section needs improvement

Categories to evaluate:
CF - Cash Flow & Repayment (historical trends, projections, DSCR, global cash flow, stress scenarios)
RR - Risk Rating (rating stated, justified by analysis, migration documented, accrual status)
CV - Collateral (appraisal referenced & dated, LTV calculated, LGD estimate, haircuts, lien position)
AL - CECL/Allowance (reserve discussed, PD/LGD/EAD, impairment analysis, qualitative factors)
CM - Covenant Monitoring (covenants listed, compliance status, waivers documented, headroom)
DP - Documentation & Policy (financials current, terms documented, approval authority, exceptions, purpose)
BI - Borrower & Industry (sector analysis, management quality, risk factors, mitigants)
CR - Concentration Risk (single-name, sector, geographic)
ST - Stress Testing (DSCR stress, collateral stress, rate shock, revenue decline)
RT - Review Timeliness (review date, frequency, independence)
ES - Climate & ESG (transition risk, physical risk, governance)
WO - Workout Plans (action plan if non-pass, timeline, upgrade conditions)

Also provide:
- An overall score (0-100)
- A summary assessment (2-3 sentences)
- The top 3 most critical gaps an examiner would flag first

IMPORTANT: Return ONLY valid JSON, no markdown, no backticks. Use this exact structure:
{"overall":85,"summary":"...","critical_gaps":["...","...","..."],"sections":{"CF":{"score":90,"status":"strong","findings":["..."],"recommendation":"..."},"RR":{"score":80,"status":"adequate","findings":["..."],"recommendation":"..."}}}`;

/* AI CALL */
async function runAI(memo){
  const resp=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      model:"claude-sonnet-4-20250514",
      max_tokens:4000,
      system:AI_PROMPT,
      messages:[{role:"user",content:"Analyze this credit memorandum:\n\n"+memo}]
    })
  });
  const data=await resp.json();
  const text=data.content?.map(b=>b.text||"").join("")||"";
  const clean=text.replace(/```json|```/g,"").trim();
  return JSON.parse(clean);
}

<div style={{flex:1}}>

{aiRes.critical_gaps&&aiRes.critical_gaps.length>0&&(

{aiRes.critical_gaps.map((g,i)=><div key={i} style={{fontSize:11,color:C.rd,padding:"4px 0",borderTop:i?`1px solid ${C.rdBd}`:"none"}}>{g}</div>)}</div>)}

<div style={{background:C.cd,borderRadius:3,border:`1px solid ${C.bd}`,overflow:"hidden"}}>
<div style={{padding:"8px 14px",borderBottom:`1px solid ${C.bd}`}}><span style={{fontSize:9,fontWeight:700,color:C.txD,letterSpacing:1}}>SECTION-BY-SECTION AI ASSESSMENT</span></div>
{S.map((sec,i)=>{const ai=aiRes.sections?.[sec.c]||{};const io=op==="ai_"+sec.id;const sc=ai.score||0;return(
<div key={sec.id} style={{borderBottom:`1px solid ${C.bd}`}}>
<button onClick={()=>setOp(io?null:"ai_"+sec.id)} style={{width:"100%",padding:"10px 14px",display:"flex",alignItems:"center",gap:10,textAlign:"left",background:io?C.sf:"transparent"}}>
<span style={{fontFamily:mono,fontSize:10,fontWeight:700,color:C.br,minWidth:22}}>{sec.c}</span>
<div style={{flex:1}}><div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}><span style={{fontSize:11,fontWeight:600,color:C.wh}}>{sec.t}</span><AISt s={ai.status}/></div><Br v={sc}/></div>
<span style={{fontSize:11,fontFamily:mono,color:sc>=80?C.gn:sc>=50?C.am:C.rd,fontWeight:600,minWidth:30,textAlign:"right"}}>{sc}%</span>
<span style={{color:C.txD,fontSize:10,marginLeft:4}}>{io?"▾":"▸"}</span></button>
{io&&(<div style={{padding:"10px 14px 12px 46px",background:C.sf}}>
{ai.findings&&ai.findings.map((f,j)=>(
<div key={j} style={{fontSize:11,color:C.tx,padding:"4px 0",borderTop:j?`1px solid ${C.bd}`:"none",lineHeight:1.6}}>
<span style={{color:C.txM}}>Finding {j+1}:</span> {f}
</div>))}
{ai.recommendation&&(
<div style={{marginTop:8,padding:"8px 10px",background:C.cd,borderRadius:3,border:`1px solid ${C.bd}`,fontSize:11,lineHeight:1.6}}>
<span style={{fontWeight:700,color:C.br}}>Recommendation:</span> <span style={{color:C.tx}}>{ai.recommendation}</span></div>)}
</div>)}
</div>)})}
</div>
</div>)}
</div>)}
</div>)}
</div>)}
