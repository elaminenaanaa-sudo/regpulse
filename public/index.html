<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{

}
textarea:focus,button:focus,input:focus{outline:none}
textarea::placeholder,input::placeholder{color:var(--ink-5)}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit;font-size:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:white}
::-webkit-scrollbar{width:10px;height:10px}

::-webkit-scrollbar-thumb:hover{background:var(--ink-5)}

.mono{font-family:'JetBrains Mono',monospace;font-feature-settings:"zero"}

/* Animations */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse-soft{0%,100%{opacity:1}50%{opacity:0.65}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:scale(1)}}

.fade-up{animation:fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both}
.fade-in{animation:fadeIn 0.4s ease both}
.scale-in{animation:scaleIn 0.4s cubic-bezier(0.16,1,0.3,1) both}
.stagger-1{animation-delay:0.05s}.stagger-2{animation-delay:0.12s}.stagger-3{animation-delay:0.2s}.stagger-4{animation-delay:0.28s}.stagger-5{animation-delay:0.36s}.stagger-6{animation-delay:0.44s}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 24px;border-radius:999px;font-size:15px;font-weight:600;
  transition:all 0.2s cubic-bezier(0.16,1,0.3,1);
  border:none;cursor:pointer;white-space:nowrap;
  font-family:inherit;
}
.btn-primary{background:var(--navy);color:white;box-shadow:var(--shadow-sm)}
.btn-primary:hover{background:var(--navy-deep);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.btn-primary:disabled{background:var(--ink-5);cursor:not-allowed;transform:none;box-shadow:none}
.btn-accent{background:var(--accent);color:white;box-shadow:0 4px 14px rgba(255,107,53,0.3)}
.btn-accent:hover{background:var(--accent-deep);transform:translateY(-2px);box-shadow:0 8px 22px rgba(255,107,53,0.4)}
.btn-secondary{background:white;color:var(--navy);border:1.5px solid var(--line-2)}
.btn-secondary:hover{border-color:var(--navy);background:var(--bg-soft)}
.btn-ghost{color:var(--ink-3);padding:10px 16px}
.btn-ghost:hover{color:var(--navy);background:var(--bg-soft)}
.btn-sm{padding:9px 16px;font-size:13px}
.btn-xs{padding:7px 14px;font-size:12.5px}

.card{background:white;border:1px solid var(--line);border-radius:16px}
.card-soft{background:var(--bg-soft);border:1px solid var(--line);border-radius:20px}
.card-lift{transition:all 0.25s cubic-bezier(0.16,1,0.3,1)}
.card-lift:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);border-color:var(--line-2)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:99px}
.chip-dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.progress-track{height:6px;border-radius:99px;background:var(--line);overflow:hidden;width:100%}
.progress-fill{height:100%;border-radius:99px;transition:width 1.2s cubic-bezier(0.16,1,0.3,1)}

.skeleton{
  background:linear-gradient(90deg,var(--line) 0%,var(--bg-soft) 50%,var(--line) 100%);

.nav-link{padding:10px 16px;font-size:14.5px;font-weight:500;color:var(--ink-3);border-radius:8px;transition:all 0.15s}
.nav-link:hover{color:var(--navy);background:var(--bg-soft)}
.nav-link.active{color:var(--navy);font-weight:600}

function kwScan(tx){const lc=tx.toLowerCase();return S.map(s=>{const r=s.ch.map(c=>({...c,f:c.kw.some(k=>lc.includes(k))}));const tw=r.reduce((a,x)=>a+x.wt,0);const fw=r.filter(x=>x.f).reduce((a,x)=>a+x.wt,0);return{...s,r,sc:tw?fw/tw:0}})}

const AI_PROMPT=`You are CRegul, an expert bank examination analyst with deep knowledge of OCC Comptroller's Handbook, FDIC MRBA data, Federal Reserve SR Letters, and real enforcement actions.

Analyze this credit review memorandum. For each of 12 categories provide: score 0-100, status (strong/adequate/weak/missing), 1-3 findings, and a recommendation if needed.

Categories: CF (Cash Flow), RR (Risk Rating), CV (Collateral), AL (CECL/Allowance), CM (Covenants), DP (Documentation), BI (Borrower/Industry), CR (Concentration), ST (Stress Testing), RT (Review Timeliness), ES (Climate/ESG), WO (Workout).

Also provide: overall score (0-100), summary (2-3 sentences), top 3 critical gaps.

Return ONLY valid JSON, no markdown:
{"overall":85,"summary":"...","critical_gaps":["...","...","..."],"sections":{"CF":{"score":90,"status":"strong","findings":["..."],"recommendation":"..."},"RR":{...}}}`;

async function runAI(memo,apiKey){
  const resp=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:4000,system:AI_PROMPT,messages:[{role:"user",content:"Analyze:\n\n"+memo}]})
  });
  if(!resp.ok){const err=await resp.text();throw new Error(`${resp.status}: ${err.slice(0,200)}`);}
  const data=await resp.json();
  const text=data.content?.map(b=>b.text||"").join("")||"";
  return JSON.parse(text.replace(/```json|```/g,"").trim());
}

async function extractPDF(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let text="";
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);
    const content=await page.getTextContent();
    text+=content.items.map(it=>it.str).join(" ")+"\n\n";
  }
  return text;
}

function exportPDF(kwRes,aiRes,overallPct,gaps,docInfo){
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"pt",format:"letter"});
  const W=612,H=792,M=48;let y=0;

  doc.setFillColor(20,40,80);doc.rect(0,0,W,100,"F");
  doc.setTextColor(255,255,255);
  doc.setFont("helvetica","bold");doc.setFontSize(26);
  doc.text("CRegul",M,50);
  doc.setFont("helvetica","normal");doc.setFontSize(10);
  doc.setTextColor(200,210,230);
  doc.text("Credit Review Compliance Report",M,68);
  doc.setFontSize(9);doc.setTextColor(160,175,200);
  doc.text(new Date().toLocaleString("en-US",{dateStyle:"long",timeStyle:"short"}),W-M,50,{align:"right"});
  doc.text(`${TC} examiner checkpoints · OCC · FDIC · FRB`,W-M,68,{align:"right"});
  y=128;

  doc.setTextColor(11,30,63);doc.setFont("helvetica","bold");doc.setFontSize(22);
  doc.text("Compliance Assessment",M,y);y+=24;
  doc.setFont("helvetica","normal");doc.setFontSize(10.5);doc.setTextColor(74,90,120);
  if(docInfo?.name){doc.text(`Source  ·  ${docInfo.name}`,M,y);y+=14;}
  doc.text(`${docInfo?.chars?.toLocaleString()||0} characters  ·  ${aiRes?"Keyword scan + AI deep analysis":"Keyword scan"}`,M,y);y+=28;

  const sc=overallPct;
  const scoreColor=sc>=80?[16,149,107]:sc>=50?[201,138,12]:[209,67,67];
  doc.setFillColor(250,251,253);doc.setDrawColor(231,235,242);
  doc.roundedRect(M,y,W-2*M,96,12,12,"FD");
  doc.setFont("helvetica","bold");doc.setFontSize(56);doc.setTextColor(...scoreColor);
  doc.text(String(sc),M+28,y+66);
  doc.setFont("helvetica","normal");doc.setFontSize(12);doc.setTextColor(123,138,163);
  doc.text("/100",M+110,y+66);
  doc.setFont("helvetica","bold");doc.setFontSize(18);doc.setTextColor(11,30,63);
  const headline=sc>=85?"Strong compliance posture":sc>=70?"Adequate, with gaps to address":sc>=50?"Requires attention":"Significant deficiencies";
  doc.text(headline,M+180,y+46);
  doc.setFont("helvetica","normal");doc.setFontSize(10.5);doc.setTextColor(74,90,120);
  doc.text(`${gaps.length} gap${gaps.length!==1?"s":""}  ·  ${gaps.filter(g=>g.ti===1).length} critical  ·  ${gaps.filter(g=>g.ti===2).length} important  ·  ${gaps.filter(g=>g.ti===3).length} emerging`,M+180,y+66);
  y+=120;

  const crit=gaps.filter(g=>g.wt>=3);
  if(crit.length){
    doc.setFillColor(252,221,221);doc.setDrawColor(240,180,180);
    doc.roundedRect(M,y,W-2*M,24+crit.length*16,8,8,"FD");
    doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(180,48,48);
    doc.text("CRITICAL GAPS  ·  HIGH-WEIGHT ITEMS",M+14,y+18);
    doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(60,20,20);
    crit.forEach((g,i)=>{doc.text(`${g.cd}    ${g.l}`,M+14,y+36+i*16);});
    y+=32+crit.length*16;
  }

  if(aiRes?.summary){
    y+=12;doc.setFont("helvetica","bold");doc.setFontSize(14);doc.setTextColor(11,30,63);
    doc.text("AI Analysis",M,y);y+=18;
    doc.setFont("helvetica","normal");doc.setFontSize(10.5);doc.setTextColor(60,74,100);
    doc.splitTextToSize(aiRes.summary,W-2*M).forEach(l=>{doc.text(l,M,y);y+=15;});
    y+=8;
    if(aiRes.critical_gaps?.length){
      doc.setFont("helvetica","bold");doc.setFontSize(11.5);doc.setTextColor(11,30,63);
      doc.text("Top findings",M,y);y+=15;
      doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(60,74,100);
      aiRes.critical_gaps.forEach((g,i)=>{
        doc.splitTextToSize(`${i+1}.  ${g}`,W-2*M-14).forEach(l=>{doc.text(l,M+14,y);y+=13;});
      });y+=10;
    }
  }

  if(y>H-200){doc.addPage();y=M;}
  doc.setFont("helvetica","bold");doc.setFontSize(15);doc.setTextColor(11,30,63);
  doc.text("Section Results",M,y);y+=20;
  doc.setDrawColor(231,235,242);doc.line(M,y,W-M,y);y+=12;

  doc.setFontSize(8);doc.setTextColor(123,138,163);doc.setFont("helvetica","bold");
  doc.text("CODE",M,y);doc.text("CATEGORY",M+50,y);doc.text("TIER",M+270,y);
  doc.text("KEYWORD",M+320,y);if(aiRes)doc.text("AI",M+400,y);
  doc.text("GAPS",W-M-30,y);y+=14;

  kwRes.forEach((sec,i)=>{
    if(y>H-60){doc.addPage();y=M;}
    if(i%2===0){doc.setFillColor(250,251,253);doc.rect(M-4,y-10,W-2*M+8,20,"F");}
    doc.setFont("courier","bold");doc.setFontSize(9.5);doc.setTextColor(255,107,53);
    doc.text(sec.c,M,y+4);
    doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(11,30,63);
    doc.text(sec.t.length>34?sec.t.slice(0,32)+"..":sec.t,M+50,y+4);
    doc.setTextColor(...(sec.ti===1?[180,48,48]:sec.ti===2?[201,138,12]:[74,90,120]));
    doc.setFontSize(9);doc.text(`T${sec.ti}`,M+270,y+4);
    const kp=Math.round(sec.sc*100);
    doc.setTextColor(...(kp>=80?[16,149,107]:kp>=50?[201,138,12]:[209,67,67]));
    doc.setFont("courier","bold");doc.text(`${kp}%`,M+320,y+4);
    if(aiRes){const ap=aiRes.sections?.[sec.c]?.score||0;
      doc.setTextColor(...(ap>=80?[16,149,107]:ap>=50?[201,138,12]:[209,67,67]));
      doc.text(`${ap}%`,M+400,y+4);}
    doc.setTextColor(123,138,163);doc.setFont("helvetica","normal");
    doc.text(String(sec.r.filter(r=>!r.f).length),W-M-30,y+4);
    y+=20;
  });

  if(gaps.length){
    if(y>H-150){doc.addPage();y=M;}else{y+=20;}
    doc.setFont("helvetica","bold");doc.setFontSize(15);doc.setTextColor(11,30,63);
    doc.text("Remediation Queue",M,y);y+=20;
    doc.setDrawColor(231,235,242);doc.line(M,y,W-M,y);y+=12;
    doc.setFontSize(9.5);
    [...gaps].sort((a,b)=>(b.wt*(4-b.ti))-(a.wt*(4-a.ti))).forEach((g,i)=>{
      if(y>H-30){doc.addPage();y=M;}
      if(i%2===0){doc.setFillColor(250,251,253);doc.rect(M-4,y-10,W-2*M+8,18,"F");}
      doc.setFont("helvetica","normal");doc.setTextColor(123,138,163);
      doc.text(String(i+1).padStart(2,"0"),M,y+2);
      doc.setFont("courier","bold");doc.setTextColor(255,107,53);
      doc.text(g.cd,M+28,y+2);
      doc.setFont("helvetica","normal");doc.setTextColor(11,30,63);
      doc.text(g.l.length>72?g.l.slice(0,70)+"..":g.l,M+60,y+2);
      doc.setTextColor(...(g.ti===1?[180,48,48]:g.ti===2?[201,138,12]:[74,90,120]));
      doc.text(`T${g.ti}`,W-M-20,y+2);
      y+=18;
    });
  }

  if(aiRes?.sections){
    doc.addPage();y=M;
    doc.setFont("helvetica","bold");doc.setFontSize(20);doc.setTextColor(11,30,63);
    doc.text("AI Deep Analysis",M,y);y+=10;
    doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(123,138,163);
    doc.text("Section-by-section assessment",M,y+14);y+=34;
    S.forEach(sec=>{
      const ai=aiRes.sections[sec.c];if(!ai)return;
      if(y>H-100){doc.addPage();y=M;}
      doc.setDrawColor(231,235,242);doc.line(M,y,W-M,y);y+=14;
      doc.setFont("courier","bold");doc.setFontSize(10.5);doc.setTextColor(255,107,53);
      doc.text(sec.c,M,y);
      doc.setFont("helvetica","bold");doc.setTextColor(11,30,63);doc.setFontSize(11);
      doc.text(sec.t,M+32,y);
      const s=ai.score||0;
      doc.setTextColor(...(s>=80?[16,149,107]:s>=50?[201,138,12]:[209,67,67]));
      doc.text(`${s}  ${(ai.status||"").toUpperCase()}`,W-M,y,{align:"right"});
      y+=18;
      if(ai.findings?.length){
        doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.setTextColor(74,90,120);
        ai.findings.forEach(f=>{
          doc.splitTextToSize("·  "+f,W-2*M-14).forEach(l=>{if(y>H-20){doc.addPage();y=M;}doc.text(l,M+14,y);y+=12;});
        });
      }
      if(ai.recommendation){
        y+=4;doc.setFont("helvetica","italic");doc.setFontSize(9.5);doc.setTextColor(60,74,100);
        doc.splitTextToSize(`Recommendation —  ${ai.recommendation}`,W-2*M-14).forEach(l=>{if(y>H-20){doc.addPage();y=M;}doc.text(l,M+14,y);y+=12;});
      }
      y+=14;
    });
  }

  const pages=doc.internal.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    doc.setPage(i);
    doc.setDrawColor(231,235,242);doc.line(M,H-36,W-M,H-36);
    doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(123,138,163);
    doc.text("cregul.com  ·  OCC  ·  FDIC  ·  Federal Reserve",M,H-20);
    doc.text(`Page ${i} of ${pages}`,W-M,H-20,{align:"right"});
    doc.setFontSize(7.5);doc.text("Pre-screening tool  ·  Not legal advice  ·  Does not substitute professional review",M,H-10);
  }
  doc.save(`CRegul_Report_${new Date().toISOString().slice(0,10)}.pdf`);
}

function TierChip({ti}){const m={1:{l:"Critical",c:"var(--err)",bg:"var(--err-soft)"},2:{l:"Important",c:"var(--warn)",bg:"var(--warn-soft)"},3:{l:"Emerging",c:"#4A5A78",bg:"#EEF2F8"}};const v=m[ti];
return <span className="chip" style={{color:v.c,background:v.bg}}><span className="chip-dot" style={{background:v.c}}/>{v.l}</span>}

function StatusChip({ok}){return <span className="chip" style={{color:ok?"var(--ok)":"var(--err)",background:ok?"var(--ok-soft)":"var(--err-soft)"}}>{ok?"✓ Pass":"✕ Missing"}</span>}

return <span className="chip" style={{color:v.c,background:v.bg}}>{v.l}</span>}

function Scanner({onSettings}){
const[step,setStep]=useState("in");
const[tx,setTx]=useState("");
const[docInfo,setDocInfo]=useState(null);
const[kwRes,setKwRes]=useState(null);
const[aiRes,setAiRes]=useState(null);
const[aiLoading,setAiLoading]=useState(false);
const[aiError,setAiError]=useState(null);
const[op,setOp]=useState(null);
const[tab,setTab]=useState("kw");
const[pdfLoading,setPdfLoading]=useState(false);
const[pdfError,setPdfError]=useState(null);
const[dragOver,setDragOver]=useState(false);
const ref=useRef();
const fileRef=useRef();

const handleFile=async(file)=>{
  if(!file)return;
  setPdfError(null);setPdfLoading(true);
  try{
    if(file.type==="application/pdf"||file.name.toLowerCase().endsWith(".pdf")){
      const text=await extractPDF(file);
      if(!text.trim())throw new Error("No text found. The PDF may be scanned — try OCR first.");
      setTx(text);setDocInfo({name:file.name,chars:text.length});
    }else if(file.type==="text/plain"||file.name.toLowerCase().endsWith(".txt")){
      const text=await file.text();setTx(text);setDocInfo({name:file.name,chars:text.length});
    }else throw new Error("Unsupported file. Upload a PDF or TXT.");
  }catch(e){setPdfError(e.message||"Failed to read file");}
  finally{setPdfLoading(false);}
};

const onDrop=useCallback((e)=>{e.preventDefault();setDragOver(false);const f=e.dataTransfer.files[0];if(f)handleFile(f);},[]);

const doScan=useCallback(()=>{
  if(!tx.trim())return;
  setKwRes(kwScan(tx));setAiRes(null);setAiError(null);setOp(null);setTab("kw");setStep("out");
  setTimeout(()=>ref.current?.scrollIntoView({behavior:"smooth",block:"start"}),80);
},[tx]);

const doAI=useCallback(async()=>{
  const key=localStorage.getItem("cregul_api_key");
  if(!key){setAiError("NO_KEY");setTab("ai");return;}
  setAiLoading(true);setAiError(null);setTab("ai");
  try{const r=await runAI(tx,key);setAiRes(r);}
  catch(e){setAiError(e.message||"AI analysis failed");}
  finally{setAiLoading(false);}
},[tx]);

const ov=kwRes?kwRes.reduce((a,r)=>a+r.sc*(r.ti===1?3:r.ti===2?2:1),0)/kwRes.reduce((a,r)=>a+(r.ti===1?3:r.ti===2?2:1),0):0;
const gaps=kwRes?kwRes.flatMap(s=>s.r.filter(c=>!c.f).map(c=>({sec:s.t,cd:s.c,ti:s.ti,...c}))):[];
const pc=Math.round(ov*100);
const exportOverall=aiRes?.overall??pc;
