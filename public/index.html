const TOTAL_CHECKS = SECTIONS.reduce((a,s) => a + s.checks.length, 0);

const SAMPLE = `CREDIT REVIEW MEMORANDUM — Annual Review
Date: March 15, 2026 | Prepared by: J. Thompson, VP | Approved by: Credit Committee, March 20, 2026

BORROWER: Midwest Industrial Holdings LLC
FACILITY: $12.5M Senior Secured Term Loan + $3M Revolving Line
MATURITY: June 2028 | RATE: SOFR + 275bps (floor 4.50%)
PURPOSE: Acquisition financing and working capital
RISK RATING: 4 — Pass-Watch (downgraded from 3 — Acceptable in Q3 2025). Rating reflects declining cash flow, covenant breach, and customer concentration. Prior rating no longer supported by financial analysis.
Accrual Status: Accruing

FINANCIAL ANALYSIS:
Historical cash flow trend (3 years): EBITDA $4.2M (2023), $3.8M (2024), $3.1M (2025). Free cash flow declined from $2.9M to $1.6M. Margin compression in core manufacturing segment.
Projected 2026 EBITDA: $3.0M–$3.4M (base case). Pro forma DSCR: 1.05x–1.20x.
DSCR: 1.12x (down from 1.45x). Fixed charge coverage: 0.98x (below 1.0x).
Global cash flow including guarantor (CEO personal financial statement on file): Combined DSCR 1.35x.

COLLATERAL:
First lien on all business assets + real estate (manufacturing facility).
Appraisal dated September 2024 by independent MAI appraiser, USPAP compliant. Appraised value $9.2M.
LTV: 67% (real estate); blended LTV 72%.
LGD estimate: 35% based on collateral coverage and sector recovery rates. Haircut: 20% discount to orderly liquidation value.

COVENANT STATUS:
Minimum DSCR 1.15x — IN BREACH (actual 1.12x). Waiver approved by Credit Committee 03/10/2026. Headroom 0.0x on leverage, trending toward breach.
Maximum Leverage 5.0x — IN COMPLIANCE. Minimum Tangible Net Worth $7.5M — IN COMPLIANCE (cushion $700K).

INDUSTRY: Manufacturing sector facing headwinds: tariffs, raw material inflation. Customer concentration risk (18% revenue lost).
Management: CEO 22 years experience. No succession plan (key person risk).
Risk factors: customer concentration, margin pressure, commodity exposure. Mitigants: diversifying customer base, long-term supply contracts.

REVIEW: Annual review completed March 2026. Prior review February 2025. Interim review triggered September 2025. Independent credit review confirmed rating.

ALLOWANCE: Specific reserve $187,500 (1.5%). PD: 4.2%. LGD: 35%. EAD: $12.5M. Expected loss: $183,750. Qualitative factors: uncertain economic outlook for manufacturing.

STRESS: Adverse case: 15% revenue decline — DSCR 0.85x, LTV 81%. Severe: 25% decline + rate shock +200bps — DSCR 0.62x. Collateral stress: 20% property value decline — LTV 89%.

POLICY: Within limits. Exception: DSCR breach CC approval obtained. Documentation exception: Phase I environmental (2021, update pending).
CLIMATE/ESG: Moderate transition risk. Facility in FEMA flood zone AE; flood insurance current.

RECOMMENDATION: Maintain Pass-Watch. Upgrade conditions: DSCR > 1.15x two quarters, Leverage < 4.5x, Customer conc. < 15%. Next review September 2026.`;

function analyze(text) {
  const lc = text.toLowerCase();
  return SECTIONS.map(sec => {
    const res = sec.checks.map(c => ({ ...c, found: c.kw.some(k => lc.includes(k)) }));
    const tw = res.reduce((a,r) => a + r.w, 0);
    const fw = res.filter(r => r.found).reduce((a,r) => a + r.w, 0);
    return { ...sec, res, score: tw ? fw / tw : 0 };
  });
}

function AnimNum({ value, duration=1200 }) {
  const [cur, setCur] = useState(0);
  useEffect(() => { let s=null; const step=(ts)=>{ if(!s)s=ts; const p=Math.min((ts-s)/duration,1); setCur(Math.round(value*(1-Math.pow(1-p,3)))); if(p<1)requestAnimationFrame(step); }; requestAnimationFrame(step); }, [value,duration]); return <>{cur}</>;
}

function ScoreArc({ score, size=140 }) {
  const pct = Math.round(score * 100);
  const clr = pct >= 80 ? MINT : pct >= 50 ? WARN : CORAL;
  const r = (size - 14) / 2, c = 2 * Math.PI * r;
  return (
    <div style={{ position:"relative", width:size, height:size }}>
      <svg width={size} height={size} style={{ transform:"rotate(-90deg)" }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#F1F5F9" strokeWidth={12} />
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={clr} strokeWidth={12} strokeDasharray={c} strokeDashoffset={c*(1-score)} strokeLinecap="round" style={{ transition:"stroke-dashoffset 1.4s cubic-bezier(.34,1.56,.64,1)" }} />
      </svg>
      <div style={{ position:"absolute", inset:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center" }}>
        <span style={{ fontSize:size*0.28, fontWeight:800, color:"#1E293B", letterSpacing:-2 }}><AnimNum value={pct} /></span>
        <span style={{ fontSize:11, fontWeight:600, color:SLATE, marginTop:-2 }}>out of 100</span>
      </div>
    </div>
  );
}

function MiniBar({ score }) {
  const clr = score >= 0.8 ? MINT : score >= 0.5 ? WARN : CORAL;
  return <div style={{ width:"100%", height:6, borderRadius:3, background:"#F1F5F9", overflow:"hidden" }}><div style={{ width:`${score*100}%`, height:"100%", borderRadius:3, background:clr, transition:"width 1s cubic-bezier(.34,1.56,.64,1)" }} /></div>;
}

function Pill({ ok }) {
  return <span style={{ display:"inline-flex", alignItems:"center", gap:4, fontSize:11, fontWeight:700, padding:"3px 10px", borderRadius:20, background:ok?"#ECFDF5":"#FEF2F2", color:ok?"#059669":"#DC2626" }}><span style={{ fontSize:8 }}>●</span>{ok?"Found":"Missing"}</span>;
}

function TierDot({ tier }) {
  const c = tier===1?CORAL:tier===2?WARN:"#60A5FA";
  return <span style={{ display:"inline-flex", alignItems:"center", gap:4, fontSize:10, fontWeight:700, color:c, background:c+"15", padding:"2px 8px", borderRadius:10 }}><span style={{ width:6, height:6, borderRadius:3, background:c }} />{tier===1?"Critical":tier===2?"Important":"Emerging"}</span>;
}

        </h1>
        <p style={{ fontSize:17, color:SLATE, lineHeight:1.7, maxWidth:520, margin:"0 auto 28px" }}>

/* ═══════ TOOL PAGE ═══════ */

function ToolPage({ go }) {
  const [step,setStep] = useState("input");
  const [text,setText] = useState("");
  const [results,setResults] = useState(null);
  const [open,setOpen] = useState(null);
  const [infoOpen,setInfoOpen] = useState(null);
  const topRef = useRef(null);

  const run = useCallback(() => {
    if (!text.trim()) return;
    setResults(analyze(text)); setOpen(null); setInfoOpen(null); setStep("results");
    setTimeout(() => topRef.current?.scrollIntoView({ behavior:"smooth" }), 80);
  }, [text]);

  const overall = results ? results.reduce((a,r)=>a+r.score*(r.tier===1?3:r.tier===2?2:1),0)/results.reduce((a,r)=>a+(r.tier===1?3:r.tier===2?2:1),0) : 0;
  const gaps = results ? results.flatMap(s=>s.res.filter(c=>!c.found).map(c=>({sec:s.title,tier:s.tier,emoji:s.emoji,...c}))) : [];
  const critGaps = gaps.filter(g=>g.w>=3);
  const pct = Math.round(overall*100);
  const grade = pct>=90?"A":pct>=80?"B+":pct>=70?"B":pct>=60?"C+":pct>=50?"C":pct>=35?"D":"F";
  const gradeClr = pct>=80?MINT:pct>=50?WARN:CORAL;
  const headline = pct>=85?"Looking great! 🎉":pct>=70?"Solid, with a few gaps.":pct>=50?"Needs attention before audit.":"Significant gaps found.";

  return (
    <div ref={topRef} style={{ maxWidth:640, margin:"0 auto", padding:"0 20px 40px" }}>
      {step==="input" && (
        <div style={{ paddingTop:32 }}>
          <div style={{ textAlign:"center", marginBottom:28 }}>
            <div style={{ fontSize:40, marginBottom:6 }}>🔬</div>
            <h1 style={{ fontSize:24, fontWeight:900, color:"#1E293B", letterSpacing:-0.5, marginBottom:8 }}>Scan your credit memo</h1>
            <p style={{ fontSize:14, color:SLATE, maxWidth:440, margin:"0 auto" }}>Paste your credit review and we'll check it against {TOTAL_CHECKS} examiner checkpoints.</p>
          </div>
          <div style={{ background:"#fff", borderRadius:16, border:"1px solid #E2E8F0", boxShadow:"0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03)", padding:20, marginBottom:16 }}>
            <textarea value={text} onChange={e=>setText(e.target.value)} placeholder={"Paste your full credit review memorandum here...\n\nThe tool checks for cash flow analysis, risk rating accuracy, collateral valuation, covenant monitoring, CECL provisions, stress testing, and more."} style={{ width:"100%", minHeight:180, border:"none", background:"transparent", fontSize:14, color:"#1E293B", lineHeight:1.6, resize:"vertical", fontFamily:"inherit" }} />
          </div>
          <div style={{ display:"flex", gap:10 }}>
            <button onClick={()=>setText(SAMPLE)} style={{ flex:"0 0 auto", padding:"14px 20px", borderRadius:12, background:"#fff", border:"1px solid #E2E8F0", color:"#1E293B", fontSize:14, fontWeight:600 }}>Try sample</button>
            <button onClick={run} disabled={!text.trim()} style={{ flex:1, padding:"14px 20px", borderRadius:12, background:text.trim()?`linear-gradient(135deg,${CORAL},#FF8E8E)`:"#E2E8F0", color:text.trim()?"#fff":"#94A3B8", fontSize:14, fontWeight:700, boxShadow:text.trim()?`0 4px 14px ${CORAL}40`:"none" }}>Scan for compliance gaps →</button>
          </div>
        </div>
      )}

      {step==="results" && results && (
        <div style={{ paddingTop:24 }}>
          <button onClick={()=>{setStep("input");setResults(null);}} style={{ fontSize:12, fontWeight:600, color:SLATE, marginBottom:16, border:"1px solid #E2E8F0", borderRadius:8, padding:"6px 14px" }}>← New scan</button>

          <div style={{ background:"#fff", borderRadius:20, padding:"28px 24px", boxShadow:"0 1px 3px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.05)", textAlign:"center", marginBottom:20, border:"1px solid #F1F5F9" }}>
            <div style={{ display:"flex", justifyContent:"center", marginBottom:12 }}><ScoreArc score={overall} /></div>
            <h2 style={{ fontSize:22, fontWeight:800, color:"#1E293B", marginBottom:4 }}>{headline}</h2>
            <p style={{ fontSize:13, color:SLATE, marginBottom:16 }}>Grade: <span style={{ fontWeight:800, color:gradeClr, fontSize:15 }}>{grade}</span> · {gaps.length} gap{gaps.length!==1?"s":""} found</p>
            <div style={{ display:"flex", justifyContent:"center", gap:8, flexWrap:"wrap" }}>
              {[{t:1,l:"Critical",c:CORAL},{t:2,l:"Important",c:WARN},{t:3,l:"Emerging",c:"#60A5FA"}].map(x=>{const n=gaps.filter(g=>g.tier===x.t).length; return (
                <div key={x.t} style={{ padding:"6px 14px", borderRadius:10, background:n>0?x.c+"12":"#F8FAFC", border:`1px solid ${n>0?x.c+"30":"#E2E8F0"}` }}>
                  <span style={{ fontSize:18, fontWeight:800, color:n>0?x.c:"#CBD5E1" }}>{n}</span>
                  <span style={{ fontSize:10, fontWeight:600, color:n>0?x.c:"#94A3B8", marginLeft:4 }}>{x.l}</span>
                </div>
              );})}
            </div>
          </div>

          {critGaps.length > 0 && (
            <div style={{ background:"#FEF2F2", borderRadius:14, padding:"16px 18px", marginBottom:16, border:"1px solid #FECACA" }}>
              <div style={{ fontSize:13, fontWeight:700, color:"#DC2626", marginBottom:8 }}>🚨 {critGaps.length} high-priority item{critGaps.length>1?"s":""} missing</div>
              <p style={{ fontSize:12, color:"#991B1B", lineHeight:1.5, opacity:0.8, marginBottom:10 }}>These carry the most weight with examiners. Fix these first.</p>
              {critGaps.map((g,i) => <div key={i} style={{ display:"flex", alignItems:"center", gap:8, padding:"7px 0", borderTop:i?"1px solid #FECACA50":"none" }}><span style={{ fontSize:15 }}>{g.emoji}</span><span style={{ fontSize:12, color:"#7F1D1D", fontWeight:500 }}>{g.l}</span></div>)}
            </div>
          )}

          <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
            {results.map(sec => {
              const isOpen = open===sec.id, found = sec.res.filter(r=>r.found).length, total = sec.res.length, perfect = found===total;
              return (
                <div key={sec.id} style={{ background:"#fff", borderRadius:14, border:`1px solid ${isOpen?"#CBD5E1":"#F1F5F9"}`, boxShadow:isOpen?"0 4px 16px rgba(0,0,0,0.06)":"0 1px 2px rgba(0,0,0,0.02)", overflow:"hidden" }}>
                  <button onClick={()=>setOpen(isOpen?null:sec.id)} style={{ width:"100%", padding:"16px 18px", display:"flex", alignItems:"center", gap:14, textAlign:"left" }}>
                    <span style={{ fontSize:26, lineHeight:1 }}>{sec.emoji}</span>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:4 }}>
                        <span style={{ fontSize:14, fontWeight:700, color:"#1E293B" }}>{sec.title}</span><TierDot tier={sec.tier} />{perfect && <span style={{ fontSize:12 }}>✅</span>}
                      </div>
                      <MiniBar score={sec.score} />
                      <div style={{ fontSize:11, color:"#94A3B8", marginTop:4 }}>{found}/{total} found · {Math.round(sec.score*100)}%</div>
                    </div>
                    <span style={{ color:"#CBD5E1", fontSize:18, transition:"transform 0.2s", transform:isOpen?"rotate(90deg)":"none" }}>›</span>
                  </button>
                  {isOpen && (
                    <div style={{ padding:"0 18px 18px", borderTop:"1px solid #F1F5F9" }}>
                      <button onClick={()=>setInfoOpen(infoOpen===sec.id?null:sec.id)} style={{ width:"100%", background:"#F8FAFC", border:"1px solid #E2E8F0", borderRadius:10, padding:"10px 14px", marginTop:14, marginBottom:14, textAlign:"left" }}>
                        <span style={{ fontSize:12, fontWeight:600, color:"#475569" }}>{infoOpen===sec.id?"▾":"▸"} Why examiners care</span>
                        {infoOpen===sec.id && <p style={{ margin:"8px 0 0", fontSize:12, color:"#64748B", lineHeight:1.7 }}>{sec.why}<br/><span style={{ fontSize:10, color:"#94A3B8", fontStyle:"italic" }}>Source: {sec.reg}</span></p>}
                      </button>
                      <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                        {sec.res.map(cp => (
                          <div key={cp.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 14px", background:cp.found?"#F0FDF4":"#FEF2F2", borderRadius:10, border:`1px solid ${cp.found?"#BBF7D0":"#FECACA"}` }}>
                            <div style={{ flex:1 }}>
                              <div style={{ fontSize:13, fontWeight:500, color:cp.found?"#166534":"#991B1B" }}>{cp.l}</div>
                              <div style={{ fontSize:10, color:cp.found?"#4ADE80":"#FCA5A5", marginTop:2 }}>Priority: {"★".repeat(cp.w)}{"☆".repeat(3-cp.w)}</div>
                            </div>
                            <Pill ok={cp.found} />
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {gaps.length > 0 && (
            <div style={{ background:"#fff", borderRadius:14, border:"1px solid #F1F5F9", padding:18, marginTop:20, boxShadow:"0 1px 3px rgba(0,0,0,0.04)" }}>
              <h3 style={{ fontSize:15, fontWeight:800, color:"#1E293B", marginBottom:4 }}>Remediation checklist</h3>
              <p style={{ fontSize:12, color:SLATE, marginBottom:14 }}>Address these before your next exam.</p>
              {gaps.sort((a,b)=>(b.w*(4-b.tier))-(a.w*(4-a.tier))).map((g,i) => (
                <div key={i} style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 0", borderTop:i?"1px solid #F8FAFC":"none" }}>
                  <div style={{ width:22, height:22, borderRadius:6, border:"2px solid #E2E8F0", flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center", fontSize:10, color:"#CBD5E1" }}>{i+1}</div>
                  <span style={{ fontSize:15 }}>{g.emoji}</span>
                  <div style={{ flex:1 }}><div style={{ fontSize:12, fontWeight:600, color:"#1E293B" }}>{g.l}</div><div style={{ fontSize:10, color:"#94A3B8" }}>{g.sec}</div></div>
                </div>
              ))}
            </div>
          )}
          {gaps.length===0 && <div style={{ background:"#F0FDF4", borderRadius:14, padding:28, marginTop:20, textAlign:"center", border:"1px solid #BBF7D0" }}><div style={{ fontSize:44, marginBottom:8 }}>🏆</div><h3 style={{ fontSize:18, fontWeight:800, color:"#166534" }}>Perfect score!</h3><p style={{ fontSize:13, color:"#15803D" }}>All examiner checkpoints detected.</p></div>}
        </div>
      )}
    </div>
  );
}

        );
      })}

      {/* Disclaimer */}
      <div style={{ background:"#F8FAFC", borderRadius:12, padding:"16px 20px", marginTop:24, border:"1px solid #E2E8F0" }}>
        <p style={{ fontSize:11, color:"#94A3B8", lineHeight:1.6, margin:0 }}>
          <strong style={{ color:"#64748B" }}>Disclaimer:</strong> RegPulse is a pre-screening tool that performs keyword-based detection against published regulatory examination guidance. It does not substitute for professional regulatory review, legal counsel, or the judgment of qualified credit risk professionals. All regulatory citations are based on publicly available documents from the OCC, FDIC, and Federal Reserve as of March 2026.
        </p>
      </div>
    </div>
  );
}

/* ═══════ APP ROUTER ═══════ */

function App() {
  const [page, setPage] = useState(window.location.hash.replace("#/","") || "");

  const go = useCallback((p) => {
    window.location.hash = "#/" + p;
    setPage(p);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }, []);

  useEffect(() => {
    const handler = () => setPage(window.location.hash.replace("#/","") || "");
    window.addEventListener("hashchange", handler);
    return () => window.removeEventListener("hashchange", handler);
  }, []);

  return (
    <div>
      <Nav page={page} go={go} />
      {page === "" && <LandingPage go={go} />}
      {page === "tool" && <ToolPage go={go} />}
      {page === "methodology" && <MethodologyPage go={go} />}
      <Footer go={go} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
